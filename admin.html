<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Merkentool – Administration</title>
  <link rel="icon" href="assets/oxfam-logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <img src="assets/oxfam-logo.png" alt="Oxfam" class="logo">
    <h1>Merkentool – Administration</h1>
    <a href="./" class="btn-light admin-link">Ouvrir l'outil</a>
  </header>

  <main>
    <section class="card" id="login-card">
      <h2><span class="step">1</span> Code administrateur</h2>
      <div class="login-row">
        <input id="admin-code" type="password" autocomplete="off" placeholder="Code administrateur">
        <button type="button" id="admin-go" class="btn-primary">Se connecter</button>
      </div>
      <p id="login-msg" class="msg warn" hidden></p>
    </section>

    <section class="card" id="status-card" hidden>
      <h2><span class="step">2</span> Données actuellement dans la base</h2>
      <table class="status" id="status"></table>
    </section>

    <section class="card" id="upload-card" hidden>
      <h2><span class="step">3</span> Charger des données</h2>
      <div class="admin-grid">
        <div>
          <div class="label">Option rapide : copier les fichiers encore présents sur le site (dossier <code>data</code> sur GitHub)</div>
          <p><button type="button" id="copy-site" class="btn-primary">Copier les données du site dans la base</button></p>
        </div>
        <hr class="admin-hr">
        <div>
          <div class="label">Ou choisir les fichiers produits par <code>tools/build_data.py</code></div>
          <div class="file-row">
            <span class="file-label">brands.json</span><input type="file" id="f-brands" accept=".json,application/json">
          </div>
          <div class="file-row">
            <span class="file-label">prices.json</span><input type="file" id="f-prices" accept=".json,application/json">
          </div>
          <p><button type="button" id="upload-files" class="btn-primary">Envoyer les fichiers choisis</button></p>
        </div>
        <div class="log" id="log"></div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
